name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python }} contracts and scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.4'
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install locked environment
        run: uv sync --frozen --python "${{ matrix.python }}"
      - name: Install checksum-verified tools and original script runtime
        run: make tools
      - name: Quality and source integrity
        run: make lint source-check generated-check
      - name: Contracts and upstream parity
        run: make test parity
      - name: Both delivery entrypoints with mock effects
        run: make scenarios
      - name: Upload fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenarios-python-${{ matrix.python }}
          path: |
            .runs/cases.json
            .runs/reducer-parity.json
          include-hidden-files: true
          if-no-files-found: ignore

  native:
    name: Native DAGU execution and Taskfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.4'
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: uv sync --frozen --python 3.12
      - name: Install checksum-verified tools
        run: make tools
      - name: Validate Taskfile and run shared targets
        run: |
          .tools/bin/task --list
          .tools/bin/task lint source-check generated-check test parity
      - name: Native previews and actual fixture scheduling
        run: .tools/bin/task ci-native
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-dagu-evidence
          path: |
            .runs/examples/**/report.json
            .runs/examples/**/attention.json
            .runs/dagu/logs/**
          include-hidden-files: true
          if-no-files-found: ignore
