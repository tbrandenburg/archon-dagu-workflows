[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "archon-dagu-workflows"
version = "0.1.0"
description = "Source-backed Archon delivery workflows for DAGU, with offline rehearsals"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "jsonschema>=4.26,<5",
    "PyYAML>=6.0.3,<7",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[project.scripts]
archon-dagu = "archon_dagu.engine:main"

[tool.hatch.build.targets.wheel]
packages = ["src/archon_dagu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp -m 'not native'"
markers = ["native: requires pinned Dagu and Linux ss/ps; run through the native gate"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["vendor", ".runs", ".tools", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
