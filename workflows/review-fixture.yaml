type: graph
description: Source-backed Archon review; fixture. See docs/composed.md.
working_dir: ${params.project_dir}
params:
- name: project_dir
  type: string
- name: state_dir
  type: string
- name: repo
  type: string
  default: ''
- name: input
  type: string
  default: ''
- name: scope
  type: string
  default: ''
- name: prior_report
  type: string
  default: ''
- name: light
  type: string
  default: 'false'
- name: part
  type: string
  default: ''
- name: errors
  type: string
  default: auto
- name: publish
  type: string
  default: 'false'
- name: pull_request
  type: string
  default: ''
- name: branch
  type: string
  default: ''
- name: draft
  type: string
  default: 'true'
- name: publish_description
  type: string
  default: 'false'
- name: base_branch
  type: string
  default: main
- name: repository
  type: string
  default: ''
- name: issue_number
  type: string
  default: ''
- name: fixture
  type: string
  default: examples/composed/review-happy.json
- name: config
  type: string
  default: config/composed.json
env:
  STANDALONE_WORKFLOW: review
  STANDALONE_MODE: fixture
  STATE_DIR: ${params.state_dir}
  TARGET_REPO: ${params.repo}
  WORK_INPUT: ${params.input}
  SCOPE: ${params.scope}
  PRIOR_REPORT: ${params.prior_report}
  PUBLISH: ${params.publish}
  STANDALONE_FIXTURE: ${params.fixture}
  STANDALONE_CONFIG: ${params.config}
  COMPOSED_LIGHT: ${params.light}
  COMPOSED_PART: ${params.part}
  COMPOSED_ERRORS: ${params.errors}
  COMPOSED_PULL_REQUEST: ${params.pull_request}
  COMPOSED_BRANCH: ${params.branch}
  COMPOSED_DRAFT: ${params.draft}
  COMPOSED_PUBLISH_DESCRIPTION: ${params.publish_description}
  COMPOSED_BASE_BRANCH: ${params.base_branch}
  COMPOSED_REPOSITORY: ${params.repository}
  COMPOSED_ISSUE_NUMBER: ${params.issue_number}
handler_on:
  failure:
    run: python -m archon_dagu.composed failure
steps:
- id: setup
  run: python -m archon_dagu.composed init
- id: policy
  depends:
  - setup
  run: python -m archon_dagu.composed stage policy
- id: mode
  depends:
  - scope
  run: python -m archon_dagu.composed stage mode
- id: review_dir
  depends:
  - setup
  run: python -m archon_dagu.composed stage review-dir
- id: scope
  depends:
  - review_dir
  run: python -m archon_dagu.composed stage scope
- id: route
  depends:
  - mode
  - scope
  run: python -m archon_dagu.composed stage route
- id: seams
  depends:
  - scope
  - route
  run: python -m archon_dagu.composed stage seams
- id: code
  depends:
  - scope
  - route
  run: python -m archon_dagu.composed stage code
- id: tests
  depends:
  - scope
  - route
  run: python -m archon_dagu.composed stage tests
- id: errors
  depends:
  - scope
  - route
  run: python -m archon_dagu.composed stage errors
- id: docs
  depends:
  - scope
  - route
  run: python -m archon_dagu.composed stage docs
- id: review_complete
  depends:
  - scope
  - route
  - seams
  - code
  - tests
  - errors
  - docs
  run: python -m archon_dagu.composed stage review-complete
- id: synthesize
  depends:
  - policy
  - mode
  - scope
  - review_complete
  run: python -m archon_dagu.composed stage synthesize
- id: publish
  depends:
  - synthesize
  run: python -m archon_dagu.composed stage publish
- id: result
  depends:
  - scope
  - publish
  run: python -m archon_dagu.composed stage result
- id: prune_scratch
  depends:
  - synthesize
  run: python -m archon_dagu.composed stage prune-scratch
- id: finish
  depends:
  - policy
  - mode
  - review_dir
  - scope
  - route
  - seams
  - code
  - tests
  - errors
  - docs
  - review_complete
  - synthesize
  - publish
  - result
  - prune_scratch
  run: python -m archon_dagu.composed report
  output: NEEDS_DECISION
