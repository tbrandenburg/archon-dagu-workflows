type: graph
description: Source-backed Archon issue-response; fixture. See docs/composed.md.
working_dir: ${params.project_dir}
params:
- name: project_dir
  type: string
- name: state_dir
  type: string
- name: repo
  type: string
  default: ''
- name: input
  type: string
  default: ''
- name: scope
  type: string
  default: ''
- name: prior_report
  type: string
  default: ''
- name: light
  type: string
  default: 'false'
- name: part
  type: string
  default: ''
- name: errors
  type: string
  default: auto
- name: publish
  type: string
  default: 'false'
- name: pull_request
  type: string
  default: ''
- name: branch
  type: string
  default: ''
- name: draft
  type: string
  default: 'true'
- name: publish_description
  type: string
  default: 'false'
- name: base_branch
  type: string
  default: main
- name: repository
  type: string
  default: ''
- name: issue_number
  type: string
  default: ''
- name: fixture
  type: string
  default: examples/composed/issue-response-happy.json
- name: config
  type: string
  default: config/composed.json
env:
  STANDALONE_WORKFLOW: issue-response
  STANDALONE_MODE: fixture
  STATE_DIR: ${params.state_dir}
  TARGET_REPO: ${params.repo}
  WORK_INPUT: ${params.input}
  SCOPE: ${params.scope}
  PRIOR_REPORT: ${params.prior_report}
  PUBLISH: ${params.publish}
  STANDALONE_FIXTURE: ${params.fixture}
  STANDALONE_CONFIG: ${params.config}
  COMPOSED_LIGHT: ${params.light}
  COMPOSED_PART: ${params.part}
  COMPOSED_ERRORS: ${params.errors}
  COMPOSED_PULL_REQUEST: ${params.pull_request}
  COMPOSED_BRANCH: ${params.branch}
  COMPOSED_DRAFT: ${params.draft}
  COMPOSED_PUBLISH_DESCRIPTION: ${params.publish_description}
  COMPOSED_BASE_BRANCH: ${params.base_branch}
  COMPOSED_REPOSITORY: ${params.repository}
  COMPOSED_ISSUE_NUMBER: ${params.issue_number}
handler_on:
  failure:
    run: python -m archon_dagu.composed failure
  success:
    run: python -m archon_dagu.composed report
steps:
- id: setup
  run: python -m archon_dagu.composed init
- id: classify
  depends:
  - setup
  run: python -m archon_dagu.composed stage classify
- id: investigate
  depends:
  - classify
  run: python -m archon_dagu.composed stage investigate
- id: approval_snapshot
  depends:
  - investigate
  run: python -m archon_dagu.composed stage approval_snapshot
  output: NEEDS_APPROVAL
- id: post_reply
  depends:
  - approval_snapshot
  run: python -m archon_dagu.composed stage post --approved
- id: finish
  depends:
  - classify
  - investigate
  - approval_snapshot
  - post_reply
  run: python -m archon_dagu.composed report
  output: NEEDS_DECISION
