type: graph
description: Archon standup; fixture transport. See docs/standalone.md.
working_dir: ${params.project_dir}
params:
- name: project_dir
  type: string
- name: state_dir
  type: string
- name: repo
  type: string
  default: ''
- name: input
  type: string
  default: ''
- name: scope
  type: string
  default: ''
- name: prior_report
  type: string
  default: ''
- name: related
  type: string
  default: '[]'
- name: publish
  type: string
  default: 'false'
- name: fixture
  type: string
  default: examples/standalone/standup-happy.json
- name: config
  type: string
  default: config/standalone.json
env:
  STANDALONE_WORKFLOW: standup
  STANDALONE_MODE: fixture
  STATE_DIR: ${params.state_dir}
  TARGET_REPO: ${params.repo}
  WORK_INPUT: ${params.input}
  SCOPE: ${params.scope}
  PRIOR_REPORT: ${params.prior_report}
  RELATED: ${params.related}
  PUBLISH: ${params.publish}
  STANDALONE_FIXTURE: ${params.fixture}
  STANDALONE_CONFIG: ${params.config}
handler_on:
  failure:
    run: python -m archon_dagu.standalone failure
steps:
- id: setup
  run: python -m archon_dagu.standalone init
- id: git_status
  depends:
  - setup
  run: python -m archon_dagu.standalone stage git-status
- id: gh_data
  depends:
  - setup
  run: python -m archon_dagu.standalone stage gh-data
- id: read_context
  depends:
  - setup
  run: python -m archon_dagu.standalone stage read-context
- id: synthesize
  depends:
  - git_status
  - gh_data
  - read_context
  run: python -m archon_dagu.standalone stage synthesize
- id: persist
  depends:
  - synthesize
  run: python -m archon_dagu.standalone stage persist
- id: report
  depends:
  - persist
  run: python -m archon_dagu.standalone report
  output: NEEDS_DECISION
